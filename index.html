<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tannery App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>

    <style>
        body { font-family: sans-serif; padding: 10px; background: #fdfdfd; }
        .screen { display: none; } .active { display: block; }
        .report-box { background: #dcedc8; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .drum-btn { width: 100%; padding: 20px; margin-bottom: 10px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; background: #4caf50; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11px; }
        th { background: #2e7d32; color: white; padding: 8px; }
        td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        .btn-edit { background: #ffca28; border: none; padding: 5px; cursor: pointer; }
        .btn-del { background: #e53935; color: white; border: none; padding: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="main-screen" class="screen active">
        <h3>TANNERY DRUMS (ONLINE)</h3>
        <!-- Report section remains same -->
        <div class="report-box">...</div> 
        <button class="drum-btn" onclick="openEntry('Drum 1 M')">Drum 1 M</button>
        <!-- Add other drums here -->
    </div>

    <div id="entry-screen" class="screen">
        <h3 id="drum-title"></h3>
        <input type="text" id="party" placeholder="Party Name">
        <input type="text" id="leather" placeholder="Leather Type">
        <input type="text" id="water" placeholder="Billo Pani (Amount)">
        <textarea id="details" placeholder="Chemicals Detail"></textarea>
        <input type="date" id="date">
        <button onclick="saveData()" style="width:100%; padding:12px; background:#2e7d32; color:white; border:none;">Save Online</button>
        <button onclick="goBack()" style="width:100%; padding:12px; margin-top:5px;">Wapas</button>
        <table id="histTable"><thead><tr><th>Date</th><th>Party</th><th>Leather</th><th>Pani</th><th>Details</th><th>Action</th></tr></thead><tbody id="data-body"></tbody></table>
    </div>

    <script>
        // Firebase Setup
        const firebaseConfig = { databaseURL: "https://mizan-khata-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentDrum = "";
        let data = []; // Local array for display

        function openEntry(name) {
            currentDrum = name;
            document.getElementById('drum-title').innerText = name;
            document.getElementById('main-screen').classList.remove('active');
            document.getElementById('entry-screen').classList.add('active');
            fetchDataOnline(); 
        }

        // Online Data Fetch
        function fetchDataOnline() {
            db.ref('tanneryData/' + currentDrum).on('value', (snapshot) => {
                data = [];
                snapshot.forEach((child) => {
                    data.push({ id: child.key, ...child.val() });
                });
                renderTable();
            });
        }

        function saveData() {
            let entry = {
                date: document.getElementById('date').value,
                party: document.getElementById('party').value,
                leather: document.getElementById('leather').value,
                water: document.getElementById('water').value,
                details: document.getElementById('details').value,
                drum: currentDrum
            };
            db.ref('tanneryData/' + currentDrum).push(entry).then(() => {
                alert("Data Online Save Ho Gaya!");
                // Clear fields
            });
        }

        function deleteItem(id) {
            db.ref('tanneryData/' + currentDrum + '/' + id).remove();
        }

        function renderTable() {
            let body = document.getElementById('data-body');
            body.innerHTML = "";
            data.forEach(x => {
                body.innerHTML += `<tr><td>${x.date}</td><td>${x.party}</td><td>${x.leather}</td><td>${x.water}</td><td>${x.details}</td><td><button class="btn-del" onclick="deleteItem('${x.id}')"><i class="fa fa-trash"></i></button></td></tr>`;
            });
        }

        function goBack() { document.getElementById('main-screen').classList.add('active'); document.getElementById('entry-screen').classList.remove('active'); }
    </script>
</body>
</html>
