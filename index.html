<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tannery Drum Tracker</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; padding: 10px; }
        .screen { display: none; } .active { display: block; }
        .drum-btn { width: 100%; padding: 15px; margin: 5px 0; background: #2e7d32; color: white; border: none; border-radius: 5px; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 12px; }
    </style>
</head>
<body>

    <!-- Main Screen -->
    <div id="main-screen" class="screen active">
        <h3>Tannery Drum Tracker</h3>
        <input type="text" id="search" placeholder="Search Party..." oninput="renderData()">
        <div id="drum-list">
            <button class="drum-btn" onclick="openEntry('Drum 1')">Drum 1</button>
            <button class="drum-btn" onclick="openEntry('Drum 2')">Drum 2</button>
            <button class="drum-btn" onclick="openEntry('Drum 3')">Drum 3</button>
        </div>
        <button onclick="window.print()" style="margin-top:20px; width:100%; padding:10px;">Print Report</button>
    </div>

    <!-- Entry Screen -->
    <div id="entry-screen" class="screen">
        <h3 id="title"></h3>
        <input type="text" id="party" placeholder="Party Name">
        <input type="text" id="leather" placeholder="Leather Type">
        <input type="text" id="water" placeholder="Billo Pani">
        <textarea id="details" placeholder="Details"></textarea>
        <button onclick="saveData()" style="width:100%; padding:15px; background:blue; color:white;">Save Entry</button>
        <button onclick="goBack()" style="width:100%; padding:15px; margin-top:5px;">Back</button>
        <table id="table"><thead><tr><th>Party</th><th>Leather</th><th>Pani</th><th>Action</th></tr></thead><tbody id="tbody"></tbody></table>
    </div>

    <script>
        // 1. Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
        }

        // 2. Firebase Initialization
        const firebaseConfig = { databaseURL: "https://mizan-khata-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 3. Force Offline Persistence (Data local save hoga)
        db.goOnline(); 
        
        let currentDrum = "";
        let allData = [];

        // 4. Data Fetching
        db.ref('tanneryData').on('value', (snapshot) => {
            allData = [];
            snapshot.forEach((child) => { allData.push({ id: child.key, ...child.val() }); });
            renderData();
        });

        function openEntry(name) {
            currentDrum = name;
            document.getElementById('title').innerText = name;
            document.getElementById('main-screen').classList.remove('active');
            document.getElementById('entry-screen').classList.add('active');
        }

        function goBack() { document.getElementById('main-screen').classList.add('active'); document.getElementById('entry-screen').classList.remove('active'); }

        function saveData() {
            let entry = {
                drum: currentDrum,
                party: document.getElementById('party').value,
                leather: document.getElementById('leather').value,
                water: document.getElementById('water').value,
                details: document.getElementById('details').value,
                date: new Date().toLocaleDateString()
            };
            db.ref('tanneryData').push(entry);
            alert("Entry Saved!");
        }

        function renderData() {
            let s = document.getElementById('search').value.toLowerCase();
            let tbody = document.getElementById('tbody');
            tbody.innerHTML = "";
            allData.filter(x => x.party.toLowerCase().includes(s)).forEach(x => {
                tbody.innerHTML += `<tr><td>${x.party}</td><td>${x.leather}</td><td>${x.water}</td><td><button onclick="db.ref('tanneryData/${x.id}').remove()">Del</button></td></tr>`;
            });
        }
    </script>
</body>
</html>
