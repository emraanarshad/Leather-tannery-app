<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tannery Drum Tracker</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2e7d32">
    <link rel="icon" type="image/png" href="logo.png">
    
    <!-- PDF Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; padding: 15px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; margin-bottom: 25px; color: #1b5e20; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }
        .screen { display: none; }
        .active { display: block; }
        .grid-container { display: grid; grid-template-columns: 1fr; gap: 14px; }
        .drum-btn { background: linear-gradient(135deg, #4caf50, #2e7d32); color: white; border: none; padding: 20px; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.1s, background 0.2s; }
        .drum-btn:active { transform: scale(0.98); background: #1b5e20; }
        .outside-btn { background: linear-gradient(135deg, #ff9800, #e65100); }
        .outside-btn:active { background: #e65100; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 15px; color: #444; }
        input { width: 100%; padding: 14px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; background-color: #fafafa; }
        input:focus { border-color: #4caf50; outline: none; background-color: #fff; }
        .btn-container { display: flex; gap: 12px; margin-top: 25px; }
        .action-btn { flex: 1; padding: 16px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
        .save-btn { background-color: #2e7d32; color: white; box-shadow: 0 4px 6px rgba(46,125,50,0.2); }
        .back-btn { background-color: #757575; color: white; }
        
        .pdf-btn { background: linear-gradient(135deg, #0288d1, #01579b); color: white; width: 100%; padding: 14px; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; text-transform: uppercase; }
        
        /* History Table Styling */
        .history-list { margin-top: 15px; border-collapse: collapse; width: 100%; font-size: 14px; }
        .history-list th, .history-list td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .history-list th { background-color: #2e7d32; color: white; }
        .history-list tr:nth-child(even) { background-color: #f9f9f9; }
        
        /* Action icons in table */
        .action-icons { display: flex; gap: 10px; font-size: 16px; cursor: pointer; }
        .edit-icon { color: #0288d1; }
        .delete-icon { color: #d32f2f; }
        
        #install-bar { display: none; background: #1b5e20; color: white; padding: 10px; text-align: center; border-radius: 8px; margin-bottom: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <div id="install-bar" onclick="installApp()">📲 Click Karein Aur App Install Karein!</div>

        <!-- FIRST WINDOW: DRUM LIST -->
        <div id="dashboard" class="screen active">
            <h2>Tannery Drums</h2>
            <div class="grid-container">
                <button class="drum-btn" onclick="openDetails('Drum 1 M')">Drum 1 M</button>
                <button class="drum-btn" onclick="openDetails('Drum 2 M')">Drum 2 M</button>
                <button class="drum-btn" onclick="openDetails('Drum 3 M')">Drum 3 M</button>
                <button class="drum-btn" onclick="openDetails('Drum 4 L')">Drum 4 L (Large)</button>
                <button class="drum-btn" onclick="openDetails('Drum 5 L')">Drum 5 L (Large)</button>
                <button class="drum-btn outside-btn" onclick="openDetails('Drum 6 Outside')">Drum 6 Outside</button>
            </div>
        </div>

        <!-- SECOND WINDOW: DRUM DETAILS & HISTORY -->
        <div id="details-screen" class="screen">
            <h2 id="selected-drum-title">Drum Details</h2>
            
            <!-- Hidden input to keep track of editing entry ID -->
            <input type="hidden" id="editing-id" value="">

            <div class="form-group">
                <label>Party Name / Party Ka Naam:</label>
                <input type="text" id="party-name" placeholder="Party name likhein">
            </div>
            <div class="form-group">
                <label>Leather Type / Chamray Ki Qisam:</label>
                <input type="text" id="leather-type" placeholder="e.g. Cow Hide, Pith">
            </div>
            <div class="form-group">
                <label>Billo Pani (Water Amount):</label>
                <input type="text" id="billo-pani" placeholder="Pani ki miqdar">
            </div>
            <div class="form-group">
                <label>Extra Chemical Details:</label>
                <input type="text" id="chemical" placeholder="Chemicals ki detail">
            </div>
            <div class="form-group">
                <label>Date / Tareekh:</label>
                <input type="date" id="entry-date">
            </div>
            <div class="btn-container">
                <button class="action-btn back-btn" onclick="goBack()">Wapas</button>
                <button class="action-btn save-btn" onclick="saveDetails()">Save Karein</button>
            </div>

            <hr style="margin-top: 30px; border: 0; border-top: 1px solid #ccc;">
            
            <!-- HISTORY SECTION -->
            <h3 style="margin-top: 20px; color: #1b5e20;">Drum Job History</h3>
            <button class="pdf-btn" onclick="downloadPDF()">📄 Download PDF History</button>

            <div style="overflow-x: auto;">
                <table class="history-list" id="pdf-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Party</th>
                            <th>Leather</th>
                            <th>Details</th>
                            <th class="no-pdf">Action</th> <!-- Hidden from PDF -->
                        </tr>
                    </thead>
                    <tbody id="history-table-body">
                        <!-- Dynamic rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let currentDrum = "";
        let deferredPrompt;

        function setTodayDate() {
            document.getElementById('entry-date').value = new Date().toISOString().substring(0, 10);
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log("Service Worker Registered"));
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-bar').style.display = 'block';
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        document.getElementById('install-bar').style.display = 'none';
                    }
                    deferredPrompt = null;
                });
            }
        }

        function openDetails(drumName) {
            currentDrum = drumName;
            document.getElementById('selected-drum-title').innerText = drumName;
            
            setTodayDate();
            clearForm();
            loadHistory(drumName);

            document.getElementById('dashboard').classList.remove('active');
            document.getElementById('details-screen').classList.add('active');
            window.scrollTo(0, 0);
        }

        function clearForm() {
            document.getElementById('party-name').value = "";
            document.getElementById('leather-type').value = "";
            document.getElementById('billo-pani').value = "";
            document.getElementById('chemical').value = "";
            document.getElementById('editing-id').value = ""; // Clear edit tag
        }

        function saveDetails() {
            let selectedDate = document.getElementById('entry-date').value;
            let editingId = document.getElementById('editing-id').value;
            let timestamp = editingId ? parseInt(editingId) : new Date().getTime(); // Use old ID if editing

            let drumData = {
                id: timestamp,
                party: document.getElementById('party-name').value,
                leather: document.getElementById('leather-type').value,
                billo: document.getElementById('billo-pani').value,
                chemical: document.getElementById('chemical').value,
                date: selectedDate
            };

            if(!drumData.party) {
                alert("Please Party Name laazmi likhein!");
                return;
            }

            let historyKey = currentDrum + "_history";
            let fullHistory = localStorage.getItem(historyKey) ? JSON.parse(localStorage.getItem(historyKey)) : [];
            
            if (editingId) {
                // Purani entry badlein
                let idx = fullHistory.findIndex(item => item.id === timestamp);
                if(idx !== -1) fullHistory[idx] = drumData;
            } else {
                // Nayi entry add karein
                fullHistory.push(drumData);
            }

            fullHistory.sort((a, b) => new Date(b.date) - new Date(a.date) || b.id - a.id);
            localStorage.setItem(historyKey, JSON.stringify(fullHistory));

            alert(editingId ? "Record sahi (Update) ho gaya!" : "Naya record register mein add ho gaya!");
            
            clearForm();
            loadHistory(currentDrum);
        }

        function loadHistory(drumName) {
            let historyKey = drumName + "_history";
            let fullHistory = localStorage.getItem(historyKey) ? JSON.parse(localStorage.getItem(historyKey)) : [];
            let tableBody = document.getElementById('history-table-body');
            
            tableBody.innerHTML = "";

            if(fullHistory.length === 0) {
                tableBody.innerHTML = "<tr><td colspan='5' style='text-align:center; color:#999;'>Koi pichla record maujood nahi hai.</td></tr>";
                return;
            }

            fullHistory.forEach(item => {
                let row = `<tr>
                    <td><b>${item.date}</b></td>
                    <td>${item.party}</td>
                    <td>${item.leather}</td>
                    <td>${item.chemical} (Billo: ${item.billo})</td>
                    <td class="no-pdf">
                        <div class="action-icons">
                            <span class="edit-icon" onclick="editEntry(${item.id})">✏️</span>
                            <span class="delete-icon" onclick="deleteEntry(${item.id})">❌</span>
                        </div>
                    </td>
                </tr>`;
                tableBody.innerHTML += row;
            });
        }

        // EDIT KARNE KA FUNCTION
        function editEntry(id) {
            let historyKey = currentDrum + "_history";
            let fullHistory = JSON.parse(localStorage.getItem(historyKey));
            let item = fullHistory.find(x => x.id === id);

            if(item) {
                document.getElementById('party-name').value = item.party;
                document.getElementById('leather-type').value = item.leather;
                document.getElementById('billo-pani').value = item.billo;
                document.getElementById('chemical').value = item.chemical;
                document.getElementById('entry-date').value = item.date;
                document.getElementById('editing-id').value = item.id; // Mark as editing
                
                window.scrollTo(0, 0); // Form upar le jaye
            }
        }

        // DELETE KARNE KA FUNCTION
        function deleteEntry(id) {
            if(confirm("Kya aap waqai is record ko hamesha ke liye delete karna chahte hain?")) {
                let historyKey = currentDrum + "_history";
                let fullHistory = JSON.parse(localStorage.getItem(historyKey));
                
                // Makhsoos entry filter out karein
                fullHistory = fullHistory.filter(item => item.id !== id);
                
                localStorage.setItem(historyKey, JSON.stringify(fullHistory));
                loadHistory(currentDrum); // Table refresh karein
            }
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFontSize(18);
            doc.text(`Tannery Job Register - ${currentDrum}`, 14, 20);

            doc.autoTable({
                html: '#pdf-table',
                startY: 30,
                theme: 'grid',
                headStyles: { fillColor: [46, 125, 50] },
                columns: [
                    { header: 'Date', dataKey: 'date' },
                    { header: 'Party', dataKey: 'party' },
                    { header: 'Leather', dataKey: 'leather' },
                    { header: 'Details', dataKey: 'details' }
                ],
                // Action column ko PDF mein na shamil karein
                didParseCell: function(data) {
                    if (data.column.index === 4) {
                        data.cell.text = '';
                    }
                }
            });

            doc.save(`${currentDrum.replace(/\s+/g, '_')}_History.pdf`);
        }

        function goBack() {
            let party = document.getElementById('party-name').value;
            if(party) {
                let conf = confirm("Aapne data save nahi kiya. Kya aap sach mein wapas jana chahte hain?");
                if(!conf) return;
            }
            document.getElementById('details-screen').classList.remove('active');
            document.getElementById('dashboard').classList.add('active');
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
