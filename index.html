<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tannery App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; padding: 10px; }
        .screen { display: none; } .active { display: block; }
        .report-box { background: #e8f5e9; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .drum-btn { width: 100%; padding: 15px; margin: 5px 0; border: none; border-radius: 5px; color: white; font-weight: bold; background: #2e7d32; }
        input, textarea { width: 100%; padding: 8px; margin: 3px 0; border: 1px solid #ccc; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 10px; }
        th, td { border: 1px solid #999; padding: 4px; text-align: center; }
        .btn-edit { background: #ffca28; border: none; padding: 3px; margin-right: 3px; }
        .btn-del { background: #e53935; color: white; border: none; padding: 3px; }
    </style>
</head>
<body>

    <div id="main-screen" class="screen active">
        <h3>TANNERY DRUMS</h3>
        <div class="report-box">
            <input type="text" id="reportSearch" placeholder="Search Party..." oninput="renderReport()">
            <input type="date" id="startDate" onchange="renderReport()">
            <input type="date" id="endDate" onchange="renderReport()">
            <div id="reportResult"></div>
            <button onclick="window.print()" style="width:100%; padding:10px; background:#2196f3; color:white; border:none;">Print Report</button>
        </div>
        <button class="drum-btn" onclick="openEntry('Drum 1 M')">Drum 1 M</button>
        <button class="drum-btn" onclick="openEntry('Drum 2 M')">Drum 2 M</button>
        <button class="drum-btn" onclick="openEntry('Drum 3 M')">Drum 3 M</button>
        <button class="drum-btn" onclick="openEntry('Drum 4 L (Large)')">Drum 4 L (Large)</button>
        <button class="drum-btn" onclick="openEntry('Drum 5 L (Large)')">Drum 5 L (Large)</button>
        <button class="drum-btn" style="background:#ff9800" onclick="openEntry('Drum 6 Outside')">Drum 6 Outside</button>
    </div>

    <div id="entry-screen" class="screen">
        <h3 id="drum-title"></h3>
        <input type="text" id="party" placeholder="Party Name">
        <input type="text" id="leather" placeholder="Leather Type">
        <input type="text" id="water" placeholder="Billo Pani">
        <textarea id="details" placeholder="Details"></textarea>
        <input type="date" id="date">
        <button onclick="saveData()" style="width:100%; padding:10px; background:#2e7d32; color:white; border:none;">Save Entry</button>
        <button onclick="goBack()" style="width:100%; padding:10px; margin-top:5px;">Wapas</button>
        <table id="histTable"><thead><tr><th>Date</th><th>Party</th><th>Leather</th><th>Pani</th><th>Details</th><th>Act</th></tr></thead><tbody id="data-body"></tbody></table>
    </div>

    <script>
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
        const firebaseConfig = { databaseURL: "https://mizan-khata-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        // Offline Persistence
        try { firebase.database().enablePersistence(); } catch (e) {}

        let currentDrum = "";
        let allData = [];

        db.ref('tanneryData').on('value', (snapshot) => {
            allData = [];
            snapshot.forEach((child) => { allData.push({ id: child.key, ...child.val() }); });
            renderReport();
            renderTable();
        });

        function openEntry(name) {
            currentDrum = name;
            document.getElementById('drum-title').innerText = name;
            document.getElementById('date').valueAsDate = new Date();
            document.getElementById('main-screen').classList.remove('active');
            document.getElementById('entry-screen').classList.add('active');
            renderTable();
        }

        function goBack() { document.getElementById('main-screen').classList.add('active'); document.getElementById('entry-screen').classList.remove('active'); }

        function saveData() {
            let entry = { drum: currentDrum, date: document.getElementById('date').value, party: document.getElementById('party').value, leather: document.getElementById('leather').value, water: document.getElementById('water').value, details: document.getElementById('details').value };
            db.ref('tanneryData').push(entry);
            // Form clear
            document.getElementById('party').value = ""; document.getElementById('leather').value = ""; document.getElementById('water').value = ""; document.getElementById('details').value = "";
        }

        function editItem(id) {
            let item = allData.find(x => x.id === id);
            document.getElementById('party').value = item.party; document.getElementById('leather').value = item.leather;
            document.getElementById('water').value = item.water; document.getElementById('details').value = item.details;
            document.getElementById('date').value = item.date;
            db.ref('tanneryData/' + id).remove();
        }

        function renderTable() {
            let body = document.getElementById('data-body');
            if(!body) return;
            body.innerHTML = "";
            allData.filter(x => x.drum === currentDrum).forEach(x => {
                body.innerHTML += `<tr><td>${x.date}</td><td>${x.party}</td><td>${x.leather}</td><td>${x.water}</td><td>${x.details}</td><td><button class="btn-edit" onclick="editItem('${x.id}')"><i class="fa fa-pen"></i></button><button class="btn-del" onclick="db.ref('tanneryData/${x.id}').remove()"><i class="fa fa-trash"></i></button></td></tr>`;
            });
        }

        function renderReport() {
            let p = document.getElementById('reportSearch').value.toLowerCase();
            let start = document.getElementById('startDate').value;
            let end = document.getElementById('endDate').value;
            let res = allData.filter(x => (x.party || "").toLowerCase().includes(p) && (!start || x.date >= start) && (!end || x.date <= end));
            let html = `<table><thead><tr><th>Date</th><th>Party</th><th>Leather</th><th>Pani</th><th>Details</th></tr></thead><tbody>`;
            res.forEach(x => html += `<tr><td>${x.date}</td><td>${x.party}</td><td>${x.leather}</td><td>${x.water}</td><td>${x.details}</td></tr>`);
            document.getElementById('reportResult').innerHTML = (p || start || end) ? html + `</tbody></table>` : "";
        }
    </script>
</body>
</html>
