
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tannery Management</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; padding: 10px; margin: 0; background: #f4f4f4; }
        .screen { display: none; background: white; padding: 15px; border-radius: 10px; min-height: 90vh; }
        .active { display: block; }
        .btn { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; box-sizing: border-box; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 13px; }
        th { background: #eee; }
        .del-btn { background: #ff4d4d; color: white; border: none; padding: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="main-screen" class="screen active">
        <h3>Drum Selection</h3>
        <button class="btn" style="background:#2e7d32; color:white;" onclick="openEntry('Drum 1')">Drum 1</button>
        <button class="btn" style="background:#2e7d32; color:white;" onclick="openEntry('Drum 2')">Drum 2</button>
        <button class="btn" style="background:#2e7d32; color:white;" onclick="openEntry('Drum 3')">Drum 3</button>
    </div>

    <div id="entry-screen" class="screen">
        <h3 id="drum-title"></h3>
        <input type="text" id="party" placeholder="Party Name">
        <input type="text" id="leather" placeholder="Leather Type">
        <input type="date" id="date">
        <button class="btn" style="background:#4caf50; color:white;" onclick="saveData()">Save Entry</button>
        <button class="btn" style="background:#555; color:white;" onclick="goBack()">Back to Home</button>
        <table id="histTable">
            <thead><tr><th>Date</th><th>Party</th><th>Leather</th><th>Action</th></tr></thead>
            <tbody id="data-body"></tbody>
        </table>
    </div>

    <script>
        const DB_KEY = 'tannery_v6_data';
        const firebaseConfig = { databaseURL: "https://mizan-khata-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let allData = JSON.parse(localStorage.getItem(DB_KEY)) || {};
        let currentDrum = "";

        // Sync from Firebase
        db.ref('tanneryData').on('value', (snapshot) => {
            if (snapshot.exists()) {
                allData = snapshot.val();
                localStorage.setItem(DB_KEY, JSON.stringify(allData));
                renderTable();
            }
        });

        function openEntry(name) {
            currentDrum = name;
            document.getElementById('drum-title').innerText = name;
            document.getElementById('main-screen').classList.remove('active');
            document.getElementById('entry-screen').classList.add('active');
            renderTable();
        }

        function goBack() { 
            document.getElementById('main-screen').classList.add('active'); 
            document.getElementById('entry-screen').classList.remove('active'); 
        }

        function saveData() {
            let id = Date.now().toString();
            let entry = { 
                drum: currentDrum, 
                date: document.getElementById('date').value, 
                party: document.getElementById('party').value, 
                leather: document.getElementById('leather').value 
            };
            
            allData[id] = entry;
            db.ref('tanneryData').set(allData);
            localStorage.setItem(DB_KEY, JSON.stringify(allData));
            
            document.getElementById('party').value = "";
            document.getElementById('leather').value = "";
            renderTable();
        }

        function deleteEntry(id) {
            delete allData[id];
            db.ref('tanneryData').set(allData);
            localStorage.setItem(DB_KEY, JSON.stringify(allData));
            renderTable();
        }

        function renderTable() {
            let body = document.getElementById('data-body');
            body.innerHTML = "";
            for (let id in allData) {
                if (allData[id].drum === currentDrum) {
                    body.innerHTML += `<tr>
                        <td>${allData[id].date}</td>
                        <td>${allData[id].party}</td>
                        <td>${allData[id].leather}</td>
                        <td><button class="del-btn" onclick="deleteEntry('${id}')">X</button></td>
                    </tr>`;
                }
            }
        }
    </script>
</body>
</html>
