<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leather Tannery Management</title>
    <!-- Bootstrap CSS for Beautiful Design -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons for Pen and Delete -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; padding: 20px; font-family: Arial, sans-serif; }
        .card { border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .card-header { background-color: #2c3e50; color: white; border-top-left-radius: 15px; border-top-right-radius: 15px; }
        .btn-primary { background-color: #2c3e50; border: none; }
        .btn-primary:hover { background-color: #1a252f; }
        .action-btn { cursor: pointer; margin: 0 5px; font-size: 1.2rem; }
        /* Yellow Pen Icon Style */
        .btn-edit { color: #ffc107; } 
        /* Red Delete Icon Style */
        .btn-delete { color: #dc3545; }
        .table-responsive { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center mb-4 text-dark fw-bold">Leather Tannery Management</h2>

    <!-- FORM CARD -->
    <div class="card">
        <div class="card-header fw-bold">
            <span id="form-title">Add New Drum Record</span>
        </div>
        <div class="card-body">
            <form id="tanneryForm">
                <input type="hidden" id="rowId" name="id">
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Date</label>
                        <input type="date" class="form-dash form-control" id="date" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Drum Selection</label>
                        <select class="form-select" id="drum" required>
                            <option value="">Select Drum</option>
                            <option value="Drum 1 (Small/Medium)">Drum 1 (Small/Medium)</option>
                            <option value="Drum 2 (Small/Medium)">Drum 2 (Small/Medium)</option>
                            <option value="Drum 3 (Small/Medium)">Drum 3 (Small/Medium)</option>
                            <option value="Drum 4 (Large)">Drum 4 (Large)</option>
                            <option value="Drum 5 (Large)">Drum 5 (Large)</option>
                            <option value="Drum 6 (Outside)">Drum 6 (Outside)</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Party Name</label>
                        <input type="text" class="form-control" id="party" placeholder="Enter Party Name" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Leather Type / Quantity</label>
                        <input type="text" class="form-control" id="leather" placeholder="e.g. Cow 100 Pcs" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Water Liters</label>
                        <input type="number" class="form-control" id="water" placeholder="e.g. 1500">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Chemical & Process Details</label>
                        <textarea class="form-control" id="details" rows="2" placeholder="Enter chemical details..."></textarea>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold" id="submitBtn">Save Record</button>
                <button type="button" class="btn btn-secondary w-100 mt-2 fw-bold d-none" id="cancelBtn" onclick="resetForm()">Cancel Edit</button>
            </form>
        </div>
    </div>

    <!-- DATA TABLE -->
    <h4 class="mt-4 mb-3 text-secondary fw-bold">All Drum Records</h4>
    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>Date</th>
                    <th>Drum</th>
                    <th>Party</th>
                    <th>Leather</th>
                    <th>Water</th>
                    <th>Details</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="dataTableBody">
                <tr>
                    <td colspan="7" class="text-center text-muted">Loading records from Google Sheets...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- JavaScript for Operations -->
<script>
    // Aapka naya aur correct web app URL
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxeNSBFnChs_kQvXd88Nj4udoMS-yV3uoKITm5VS1Qpu7YROaHhnHxKvbv6XhnlktwNbA/exec';
    let allRecords = [];

    // 1. DATA READ KARNA (FETCH)
    function fetchRecords() {
        fetch(`${scriptURL}?action=fetch`)
            .then(response => response.json())
            .then(result => {
                if (result.status === "success") {
                    allRecords = result.data;
                    renderTable(allRecords);
                } else {
                    alert("Data load nahi ho saka!");
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById("dataTableBody").innerHTML = `<tr><td colspan="7" class="text-center text-danger">Internet/Connection Error!</td></tr>`;
            });
    }

    function renderTable(data) {
        const tbody = document.getElementById("dataTableBody");
        tbody.innerHTML = "";
        
        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">No records found.</td></tr>`;
            return;
        }

        data.forEach(row => {
            // Google sheet date format fix
            let formattedDate = row.date;
            if(row.date && row.date.includes("T")) {
                formattedDate = row.date.split("T")[0];
            }

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${formattedDate || ''}</td>
                <td><span class="badge bg-secondary">${row.drum || ''}</span></td>
                <td><strong>${row.party || ''}</strong></td>
                <td>${row.leather || ''}</td>
                <td>${row.water ? row.water + ' L' : '-'}</td>
                <td><small>${row.details || ''}</small></td>
                <td>
                    <!-- Yellow Pen Icon for Edit -->
                    <i class="fa-solid fa-pen action-btn btn-edit" onclick="editRecord('${row.id}')" title="Edit"></i>
                    <!-- Red Trash Icon for Delete -->
                    <i class="fa-solid fa-trash action-btn btn-delete" onclick="deleteRecord('${row.id}')" title="Delete"></i>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 2. DATA SAVE YA UPDATE KARNA
    document.getElementById("tanneryForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "Processing, Please wait...";

        let id = document.getElementById("rowId").value;
        if (!id) {
            id = "ID-" + Date.now(); // Agar naya record hai toh unique ID generate hogi
        }

        const payload = {
            action: "save",
            id: id,
            date: document.getElementById("date").value,
            drum: document.getElementById("drum").value,
            party: document.getElementById("party").value,
            leather: document.getElementById("leather").value,
            water: document.getElementById("water").value,
            details: document.getElementById("details").value
        };

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors', // Mobile issues se bachne ke liye
            cache: 'no-cache',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            alert("Record successfully saved!");
            resetForm();
            setTimeout(fetchRecords, 1500); // 1.5 second baad refresh takay sheet update ho chuki ho
        })
        .catch(error => {
            alert("Kuch masla hua hai, dobara try karein.");
            console.error('Error:', error);
            submitBtn.disabled = false;
            submitBtn.innerText = "Save Record";
        });
    });

    // 3. EDIT PAR FORM MEIN DATA LANA
    function editRecord(id) {
        const record = allRecords.find(r => r.id.toString() === id.toString());
        if (!record) return;

        document.getElementById("rowId").value = record.id;
        
        if(record.date && record.date.includes("T")) {
            document.getElementById("date").value = record.date.split("T")[0];
        } else {
            document.getElementById("date").value = record.date;
        }

        document.getElementById("drum").value = record.drum;
        document.getElementById("party").value = record.party;
        document.getElementById("leather").value = record.leather;
        document.getElementById("water").value = record.water;
        document.getElementById("details").value = record.details;

        document.getElementById("form-title").innerText = "Edit Drum Record (ID: " + id + ")";
        document.getElementById("submitBtn").innerText = "Update Record";
        document.getElementById("cancelBtn").classList.remove("d-none");
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // FORM RESET KARNA
    function resetForm() {
        document.getElementById("tanneryForm").reset();
        document.getElementById("rowId").value = "";
        document.getElementById("form-title").innerText = "Add New Drum Record";
        document.getElementById("submitBtn").innerText = "Save Record";
        document.getElementById("submitBtn").disabled = false;
        document.getElementById("cancelBtn").classList.add("d-none");
    }

    // 4. DELETE (MITAANE) KA KAAM
    function deleteRecord(id) {
        if (confirm("Kya aap sach mein yeh record delete karna chahte hain?")) {
            document.getElementById("dataTableBody").innerHTML = `<tr><td colspan="7" class="text-center text-warning">Deleting record... Please wait...</td></tr>`;
            
            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: "delete", id: id })
            })
            .then(() => {
                alert("Record successfully deleted!");
                setTimeout(fetchRecords, 1500);
            })
            .catch(error => {
                alert("Delete nahi ho saka!");
                console.error('Error:', error);
                fetchRecords();
            });
        }
    }

    // Page load hote hi data lekar aaye
    window.onload = fetchRecords;
</script>

</body>
</html>
