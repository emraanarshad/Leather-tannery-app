<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tannery Drums</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2e7d32">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 15px;
        }
        .header {
            text-align: center;
            color: #1b5e20;
            font-size: 1.6rem;
            margin-bottom: 25px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .screen {
            display: none;
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        .screen.active {
            display: block;
        }
        .drum-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .drum-btn {
            width: 100%;
            padding: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .drum-btn.outside {
            background: linear-gradient(135deg, #ff9800, #e65100);
        }
        .drum-btn.has-load {
            background: linear-gradient(135deg, #00bcd4, #0097a7) !important;
        }
        .back-btn {
            background: #555555;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin: 12px 0 4px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        input, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            margin-bottom: 10px;
        }
        .btn-save {
            background: #2e7d32;
            color: white;
            font-weight: bold;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 6px;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .details-box {
            background: #eef2f3;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 5px solid #2e7d32;
            font-size: 0.95rem;
        }
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 16px;
            position: fixed;
            z-index: 10;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-weight: bold;
        }
        #toast.show {
            visibility: visible;
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: MAIN DRUMS WINDOW -->
    <div id="screen-main" class="screen active">
        <div class="header">Tannery Drums</div>
        <div class="drum-list">
            <button class="drum-btn" id="btn-Drum 1 M" onclick="openDrumWindow('Drum 1 M')">Drum 1 M <div id="lbl-Drum 1 M" style="font-size:0.9rem; font-weight:normal;"></div></button>
            <button class="drum-btn" id="btn-Drum 2 M" onclick="openDrumWindow('Drum 2 M')">Drum 2 M <div id="lbl-Drum 2 M" style="font-size:0.9rem; font-weight:normal;"></div></button>
            <button class="drum-btn" id="btn-Drum 3 M" onclick="openDrumWindow('Drum 3 M')">Drum 3 M <div id="lbl-Drum 3 M" style="font-size:0.9rem; font-weight:normal;"></div></button>
            <button class="drum-btn" id="btn-Drum 4 L" onclick="openDrumWindow('Drum 4 L')">Drum 4 L (Large) <div id="lbl-Drum 4 L" style="font-size:0.9rem; font-weight:normal;"></div></button>
            <button class="drum-btn" id="btn-Drum 5 L" onclick="openDrumWindow('Drum 5 L')">Drum 5 L (Large) <div id="lbl-Drum 5 L" style="font-size:0.9rem; font-weight:normal;"></div></button>
            <button class="drum-btn outside" id="btn-Drum 6 Outside" onclick="openDrumWindow('Drum 6 Outside')">Drum 6 Outside <div id="lbl-Drum 6 Outside" style="font-size:0.9rem; font-weight:normal;"></div></button>
        </div>
    </div>

    <!-- SCREEN 2: ENTRY & DETAILS WINDOW -->
    <div id="screen-entry" class="screen">
        <button class="back-btn" onclick="showMainScreen()">← Wapis (Back)</button>
        <div class="header" id="entry-header">Drum Details</div>
        
        <form id="drumForm" onsubmit="saveToSheet(event)">
            <label>Tareekh (Date):</label>
            <input type="date" id="inpDate" required>

            <label>Party Ka Naam:</label>
            <input type="text" id="inpParty" placeholder="Party ka naam" required>

            <label>Chumra / Maal Type:</label>
            <input type="text" id="inpLeather" placeholder="e.g. Cow/Buffalo" required>

            <label>Pani Ki Miqdar (Water Level):</label>
            <input type="text" id="inpWater" placeholder="e.g. Billo Pani, 1/2 Pani">

            <label>Chemicals / Details:</label>
            <textarea id="inpDetails" rows="4" placeholder="Chemicals ki tafseel..."></textarea>

            <button type="submit" class="btn-save">Data Save Karein</button>
        </form>

        <!-- Current Active Live Details Display Below Form -->
        <div id="liveDetailsDisplay" class="details-box" style="display:none;">
            <strong>Is Drum Ka Mojooda Maal:</strong><br>
            <span id="txtLiveDetails"></span>
        </div>
    </div>

    <div id="toast">Loading...</div>

    <script>
        // SCRIPT URL COMPLETE AND FIXED
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzR7pS6ZkFbywDkXInT5M01vOIdH5-NdfuQ7M1WpZ5Vv6Z_W25bO8bSwh_g6bC_f8Nl/exec";
        let selectedDrum = "";
        let sheetRecords = [];

        document.getElementById('inpDate').valueAsDate = new Date();

        async function loadSheetData() {
            try {
                let res = await fetch(`${SCRIPT_URL}?action=fetch`);
                let json = await res.json();
                if(json.status === "success") {
                    sheetRecords = json.data;
                    updateMainButtons();
                }
            } catch(e) { console.log("Load Error", e); }
        }

        function updateMainButtons() {
            const list = ['Drum 1 M', 'Drum 2 M', 'Drum 3 M', 'Drum 4 L', 'Drum 5 L', 'Drum 6 Outside'];
            list.forEach(d => {
                let btn = document.getElementById(`btn-${d}`);
                let lbl = document.getElementById(`lbl-${d}`);
                if(btn && lbl) {
                    btn.classList.remove('has-load');
                    lbl.innerText = "Khali (Empty)";
                }
            });

            sheetRecords.forEach(r => {
                let btn = document.getElementById(`btn-${r.drum}`);
                let lbl = document.getElementById(`lbl-${r.drum}`);
                if(btn && lbl) {
                    btn.classList.add('has-load');
                    lbl.innerText = `Maal: ${r.party} (${r.leather})`;
                }
            });
        }

        function openDrumWindow(drumName) {
            selectedDrum = drumName;
            document.getElementById('entry-header').innerText = drumName;
            
            document.getElementById('screen-main').classList.remove('active');
            document.getElementById('screen-entry').classList.add('active');

            let match = sheetRecords.find(r => r.drum === drumName);
            let displayBox = document.getElementById('liveDetailsDisplay');
            
            if(match) {
                document.getElementById('inpDate').value = match.date ? match.date.split('T')[0] : '';
                document.getElementById('inpParty').value = match.party || '';
                document.getElementById('inpLeather').value = match.leather || '';
                document.getElementById('inpWater').value = match.water || '';
                document.getElementById('inpDetails').value = match.details || '';
                
                document.getElementById('txtLiveDetails').innerHTML = `
                    <strong>Tareekh:</strong> ${match.date ? match.date.split('T')[0] : ''}<br>
                    <strong>Party:</strong> ${match.party || ''}<br>
                    <strong>Maal:</strong> ${match.leather || ''}<br>
                    <strong>Pani:</strong> ${match.water || 'Nahi likha'}<br>
                    <strong>Chemicals:</strong> ${match.details || ''}
                `;
                displayBox.style.display = "block";
            } else {
                document.getElementById('inpParty').value = "";
                document.getElementById('inpLeather').value = "";
                document.getElementById('inpWater').value = "";
                document.getElementById('inpDetails').value = "";
                document.getElementById('inpDate').valueAsDate = new Date();
                displayBox.style.display = "none";
            }
        }

        function showMainScreen() {
            document.getElementById('screen-entry').classList.remove('active');
            document.getElementById('screen-main').classList.add('active');
        }

        async function saveToSheet(e) {
            e.preventDefault();
            
            let existing = sheetRecords.find(r => r.drum === selectedDrum);
            let rowId = existing ? existing.id.toString() : new Date().getTime().toString();

            let payload = {
                action: "save",
                id: rowId,
                date: document.getElementById('inpDate').value,
                drum: selectedDrum,
                party: document.getElementById('inpParty').value,
                leather: document.getElementById('inpLeather').value,
                water: document.getElementById('inpWater').value,
                details: document.getElementById('inpDetails').value
            };

            showPopup("Google Sheet me save ho raha hai...");

            try {
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                showPopup("Data successfully Sheet me chalagya!");
                setTimeout(() => {
                    loadSheetData();
                    showMainScreen();
                }, 1200);
                
            } catch(err) {
                showPopup("Net slow hai, dobara save dabayein.");
            }
        }

        function showPopup(text) {
            let t = document.getElementById("toast");
            t.innerText = text;
            t.classList.add("show");
            setTimeout(() => { t.classList.remove("show"); }, 3000);
        }

        window.onload = loadSheetData;
    </script>
</body>
</html>
