<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tannery App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; padding: 15px; background: #fdfdfd; }
        .screen { display: none; }
        .active { display: block; }
        .drum-btn { width: 100%; padding: 20px; margin-bottom: 10px; background: #4caf50; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .input-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn-row { display: flex; gap: 10px; margin-top: 10px; }
        .btn-wapas { flex: 1; padding: 12px; background: #757575; color: white; border: none; border-radius: 6px; font-weight: bold; }
        .btn-save { flex: 1; padding: 12px; background: #2e7d32; color: white; border: none; border-radius: 6px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #2e7d32; color: white; padding: 10px; }
        td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        .btn-edit { background: #ffca28; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Main Screen -->
    <div id="main-screen" class="screen active">
        <h3>Tannery Drums</h3>
        <input type="text" placeholder="Party Drum Detail Report..." style="margin-bottom:15px; padding:12px;">
        <button class="drum-btn" onclick="openEntry('Drum 1 M')">Drum 1 M</button>
        <button class="drum-btn" onclick="openEntry('Drum 2 M')">Drum 2 M</button>
        <button class="drum-btn" onclick="openEntry('Drum 3 M')">Drum 3 M</button>
        <button class="drum-btn" onclick="openEntry('Drum 4 L')">Drum 4 L (Large)</button>
        <button class="drum-btn" onclick="openEntry('Drum 5 L')">Drum 5 L (Large)</button>
        <button class="drum-btn" style="background:#ff9800" onclick="openEntry('Drum 6 Outside')">Drum 6 Outside</button>
    </div>

    <!-- Entry Screen -->
    <div id="entry-screen" class="screen">
        <h3 id="drum-title"></h3>
        <div class="input-group">
            <label>Party name likhein:</label>
            <input type="text" id="party" placeholder="Party name">
        </div>
        <div class="input-group">
            <label>Leather Type / Chamray Ki Qisam:</label>
            <input type="text" id="leather" placeholder="e.g. Cow Hide, Pith">
        </div>
        <div class="input-group">
            <label>Billo Pani (Water Amount):</label>
            <input type="text" id="water" placeholder="Pani ki miqdar">
        </div>
        <div class="input-group">
            <label>Extra Chemical Details:</label>
            <textarea id="details" rows="3" placeholder="Chemicals ki detail"></textarea>
        </div>
        <div class="input-group">
            <label>Date / Tareekh:</label>
            <input type="date" id="date">
        </div>

        <div class="btn-row">
            <button class="btn-wapas" onclick="goBack()">Wapas</button>
            <button class="btn-save" onclick="saveData()">Save Karein</button>
        </div>

        <h3 id="history-title">Job History</h3>
        <button style="width:100%; padding:10px; background:#d32f2f; color:white; border:none; border-radius:5px;">
            <i class="fa fa-file-pdf"></i> Download Drum History PDF
        </button>

        <table>
            <thead><tr><th>Date</th><th>Party</th><th>Leather</th><th>Details</th><th>Action</th></tr></thead>
            <tbody id="data-body"></tbody>
        </table>
    </div>

    <script>
        let data = JSON.parse(localStorage.getItem('tanneryData')) || [];
        let currentDrum = "";

        function openEntry(name) {
            currentDrum = name;
            document.getElementById('drum-title').innerText = name;
            document.getElementById('main-screen').classList.remove('active');
            document.getElementById('entry-screen').classList.add('active');
            renderTable();
        }

        function goBack() {
            document.getElementById('main-screen').classList.add('active');
            document.getElementById('entry-screen').classList.remove('active');
        }

        function saveData() {
            data.push({ id: Date.now(), drum: currentDrum, date: document.getElementById('date').value, party: document.getElementById('party').value, leather: document.getElementById('leather').value, details: document.getElementById('details').value });
            localStorage.setItem('tanneryData', JSON.stringify(data));
            renderTable();
        }

        function renderTable() {
            let body = document.getElementById('data-body');
            body.innerHTML = "";
            data.filter(x => x.drum === currentDrum).forEach(x => {
                body.innerHTML += `<tr><td>${x.date}</td><td>${x.party}</td><td>${x.leather}</td><td>${x.details}</td><td><button class="btn-edit"><i class="fa fa-pen"></i></button></td></tr>`;
            });
        }
    </script>
</body>
</html>
