<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tannery App</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f4f6f8; }
        .btn { width: 100%; padding: 20px; margin-bottom: 10px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
        .drum-btn { background: #4caf50; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    </style>
</head>
<body>
    <div id="main">
        <h3>Tannery Drums</h3>
        <button class="btn drum-btn" onclick="openEntry('Drum 1 M')">Drum 1 M</button>
        <button class="btn drum-btn" onclick="openEntry('Drum 2 M')">Drum 2 M</button>
        <button class="btn drum-btn" onclick="openEntry('Drum 3 M')">Drum 3 M</button>
        <button class="btn drum-btn" onclick="openEntry('Drum 4 L')">Drum 4 L (Large)</button>
        <button class="btn drum-btn" onclick="openEntry('Drum 5 L')">Drum 5 L (Large)</button>
        <button class="btn drum-btn" style="background:#ff9800" onclick="openEntry('Drum 6 Outside')">Drum 6 Outside</button>
    </div>

    <div id="entry" style="display:none;">
        <h3 id="title">Drum Details</h3>
        <input type="text" id="inpParty" placeholder="Party Name">
        <input type="text" id="inpLeather" placeholder="Leather Type">
        <input type="date" id="inpDate">
        <button class="btn" style="background:#2e7d32" onclick="save()">Save Karein</button>
        <button class="btn" style="background:#757575" onclick="showMain()">Wapas</button>
        <table><thead><tr><th>Date</th><th>Party</th><th>Action</th></tr></thead><tbody id="body"></tbody></table>
    </div>

    <script>
        let drum = "";
        let data = JSON.parse(localStorage.getItem('tanneryData')) || [];

        function openEntry(name) {
            drum = name;
            document.getElementById('title').innerText = name;
            document.getElementById('main').style.display = 'none';
            document.getElementById('entry').style.display = 'block';
            render();
        }

        function showMain() {
            document.getElementById('main').style.display = 'block';
            document.getElementById('entry').style.display = 'none';
        }

        function save() {
            let entry = {
                id: Date.now(),
                drum: drum,
                date: document.getElementById('inpDate').value,
                party: document.getElementById('inpParty').value,
                leather: document.getElementById('inpLeather').value
            };
            data.push(entry);
            localStorage.setItem('tanneryData', JSON.stringify(data));
            alert("Data Save Ho Gaya!");
            render();
        }

        function render() {
            let body = document.getElementById('body');
            body.innerHTML = "";
            data.filter(r => r.drum === drum).forEach(r => {
                body.innerHTML += `<tr><td>${r.date}</td><td>${r.party}</td><td><button onclick="del(${r.id})">Del</button></td></tr>`;
            });
        }

        function del(id) {
            data = data.filter(r => r.id !== id);
            localStorage.setItem('tanneryData', JSON.stringify(data));
            render();
        }
    </script>
</body>
</html>
