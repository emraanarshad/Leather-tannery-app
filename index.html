<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tannery Online</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; padding: 10px; }
        .screen { display: none; } .active { display: block; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; }
        .drum-btn { width: 100%; padding: 20px; margin-bottom: 10px; background: #4caf50; color: white; border: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    </style>
</head>
<body>

<div id="main-screen" class="screen active">
    <h3>TANNERY DRUMS</h3>
    <button class="drum-btn" onclick="openEntry('Drum 1')">Drum 1</button>
    <button class="drum-btn" onclick="openEntry('Drum 2')">Drum 2</button>
</div>

<div id="entry-screen" class="screen">
    <h3 id="drum-title"></h3>
    <input type="text" id="party" placeholder="Party Name">
    <input type="text" id="leather" placeholder="Leather">
    <textarea id="details" placeholder="Chemicals"></textarea>
    <button onclick="saveData()" style="padding:15px; width:100%; background:blue; color:white;">Save Online</button>
    <button onclick="goBack()" style="padding:15px; width:100%; margin-top:10px;">Back</button>
    <table><thead><tr><th>Party</th><th>Leather</th><th>Action</th></tr></thead><tbody id="data-body"></tbody></table>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://mizan-khata-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentDrum = "";

    function openEntry(name) {
        currentDrum = name;
        document.getElementById('drum-title').innerText = name;
        document.getElementById('main-screen').classList.remove('active');
        document.getElementById('entry-screen').classList.add('active');
        fetchData();
    }

    function goBack() { document.getElementById('main-screen').classList.add('active'); document.getElementById('entry-screen').classList.remove('active'); }

    function saveData() {
        let entry = {
            party: document.getElementById('party').value,
            leather: document.getElementById('leather').value,
            details: document.getElementById('details').value
        };
        // 'tanneryData' naam ka folder banayega database mein
        db.ref('tanneryData/' + currentDrum).push(entry).then(() => {
            alert("Save ho gaya!");
            document.getElementById('party').value = "";
        });
    }

    function fetchData() {
        db.ref('tanneryData/' + currentDrum).on('value', (snapshot) => {
            let body = document.getElementById('data-body');
            body.innerHTML = "";
            snapshot.forEach((child) => {
                let x = child.val();
                body.innerHTML += `<tr><td>${x.party}</td><td>${x.leather}</td><td>Saved</td></tr>`;
            });
        });
    }
</script>
</body>
</html>
